[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "copperscript"
version = "0.1.0.dev0"
description = "Open-source OSINT tool that organizes collected data and displays it as a graph."
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[project.scripts]
copperscript = "copperscript.cli:app"

[tool.setuptools.packages.find]
include = ["copperscript*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# La plantilla HTML/JS embebida tiene líneas largas que no conviene partir.
"copperscript/exporters/html_graph.py" = ["E501"]
